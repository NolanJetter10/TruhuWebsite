<svg xmlns="http://www.w3.org/2000/svg" width="140" height="160" viewBox="0 0 140 160" role="img" aria-label="SOC 2 Type II Compliant">
  <defs>
    <!-- Shield body gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1f3c"/>
      <stop offset="50%" style="stop-color:#0f2f5a"/>
      <stop offset="100%" style="stop-color:#071628"/>
    </linearGradient>
    <!-- Green glow gradient -->
    <radialGradient id="glowGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" style="stop-color:#38B000;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#38B000;stop-opacity:0"/>
    </radialGradient>
    <!-- Blue accent gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0582DC"/>
      <stop offset="50%" style="stop-color:#38B000"/>
      <stop offset="100%" style="stop-color:#0582DC"/>
    </linearGradient>
    <!-- Checkmark gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="100%" style="stop-color:#38B000"/>
    </linearGradient>
    <!-- Outer glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer glow halo -->
  <path d="M70 6 L126 28 L126 82 C126 116 70 154 70 154 C70 154 14 116 14 82 L14 28 Z"
    fill="none" stroke="#38B000" stroke-width="1.5" stroke-opacity="0.25" filter="url(#softGlow)"/>

  <!-- Shield body -->
  <path d="M70 10 L122 31 L122 82 C122 114 70 150 70 150 C70 150 18 114 18 82 L18 31 Z"
    fill="url(#shieldGrad)"/>

  <!-- Inner glow overlay -->
  <path d="M70 10 L122 31 L122 82 C122 114 70 150 70 150 C70 150 18 114 18 82 L18 31 Z"
    fill="url(#glowGrad)"/>

  <!-- Gradient border ring -->
  <path d="M70 10 L122 31 L122 82 C122 114 70 150 70 150 C70 150 18 114 18 82 L18 31 Z"
    fill="none" stroke="url(#borderGrad)" stroke-width="2" opacity="0.9"/>

  <!-- Inner border -->
  <path d="M70 18 L114 36 L114 82 C114 110 70 142 70 142 C70 142 26 110 26 82 L26 36 Z"
    fill="none" stroke="#0582DC" stroke-width="0.75" stroke-opacity="0.4"/>

  <!-- Checkmark circle -->
  <circle cx="70" cy="64" r="22" fill="#0582DC" fill-opacity="0.15" stroke="url(#checkGrad)" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="70" cy="64" r="16" fill="#38B000" fill-opacity="0.12"/>

  <!-- Checkmark icon -->
  <polyline points="59,64 66,72 81,55"
    fill="none" stroke="url(#checkGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- SOC 2 label -->
  <text x="70" y="103" text-anchor="middle"
    fill="#ffffff" font-family="system-ui,'Segoe UI',sans-serif"
    font-size="15" font-weight="800" letter-spacing="0.06em">SOC 2</text>

  <!-- Divider line -->
  <line x1="40" y1="109" x2="100" y2="109" stroke="#0582DC" stroke-width="0.75" stroke-opacity="0.5"/>

  <!-- TYPE II label -->
  <text x="70" y="122" text-anchor="middle"
    fill="#CDE6F8" font-family="system-ui,'Segoe UI',sans-serif"
    font-size="8.5" font-weight="700" letter-spacing="0.18em">TYPE II</text>

  <!-- COMPLIANT label -->
  <text x="70" y="136" text-anchor="middle"
    fill="#38B000" font-family="system-ui,'Segoe UI',sans-serif"
    font-size="7.5" font-weight="700" letter-spacing="0.14em" filter="url(#glow)">COMPLIANT</text>

  <!-- Corner star accents -->
  <circle cx="36" cy="36" r="1.5" fill="#0582DC" opacity="0.7"/>
  <circle cx="104" cy="36" r="1.5" fill="#38B000" opacity="0.7"/>
  <circle cx="30" cy="60" r="1" fill="#0582DC" opacity="0.5"/>
  <circle cx="110" cy="60" r="1" fill="#38B000" opacity="0.5"/>
</svg>
